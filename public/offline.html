<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Sin conexión · CHIKILUKY</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .card { max-width: 420px; }
      img { width: 72px; height: 72px; border-radius: 14px; margin-bottom: 1.5rem; }
      h1 {
        font-family: 'Oswald', system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 1.4rem;
        margin: 0 0 0.75rem;
      }
      p { color: rgba(255, 255, 255, 0.6); line-height: 1.7; font-size: 0.95rem; margin: 0 0 1.75rem; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 2rem;
        border: 1px solid #BA8F57;
        color: #BA8F57;
        text-decoration: none;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 12px;
        transition: all 0.25s ease;
      }
      a:hover { background: #BA8F57; color: #000; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="CHIKILUKY" />
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectarnos a Internet. Revisa tu red y vuelve a intentarlo:
        tus reservas, chats y datos siguen a salvo.
      </p>
      <a href="/">Reintentar</a>
    </div>
  </body>
</html>
